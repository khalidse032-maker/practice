<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Database - Frontend Interface</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">🍃</div>
        <div>
          <h1>University Database Interface</h1>
          <p class="subtitle">Client-Side Frontend Application (No Local Server or Port Required)</p>
        </div>
      </div>
      <div class="status-badge online">
        <span class="status-dot"></span> Frontend Ready
      </div>
    </header>

    <!-- Secret URL Card -->
    <div class="card config-card">
      <div class="config-header">
        <span class="config-label">🔑 Configured Secret URL:</span>
        <button id="copyUrlBtn" class="btn outline-btn small-btn" title="Copy to clipboard">
          📋 Copy URL
        </button>
      </div>
      <div class="url-box">
        <input 
          type="text" 
          id="secretUrlInput" 
          value="mongodb+srv://khalidmkhalidcompk_db_user:khalid@cluster0.yihuv71.mongodb.net/university?appName=Cluster0" 
          readonly 
        />
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="main-layout">
      <!-- Left: Create Record Form -->
      <section class="card form-card">
        <div class="card-header">
          <h2>➕ Add New Record</h2>
          <p>Insert a document into the dataset</p>
        </div>
        <form id="recordForm">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" placeholder="e.g. Alex Johnson" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="e.g. alex@university.edu" required />
          </div>

          <div class="form-group">
            <label for="department">Department / Major</label>
            <input type="text" id="department" placeholder="e.g. Computer Science" />
          </div>

          <div class="form-group">
            <label for="details">Additional Notes / Info</label>
            <textarea id="details" rows="2" placeholder="e.g. Semester 4, GPA 3.8"></textarea>
          </div>

          <button type="submit" class="btn primary-btn">
            💾 Save Record
          </button>
        </form>
      </section>

      <!-- Right: Records Table & Operations -->
      <section class="card list-card">
        <div class="card-header list-header">
          <div>
            <h2>📋 Records (<span id="recordCount">0</span>)</h2>
            <p>Saved in browser storage</p>
          </div>
          <div class="header-actions">
            <button id="exportBtn" class="btn outline-btn small-btn" title="Export as JSON">
              📥 Export
            </button>
            <button id="resetBtn" class="btn outline-btn small-btn" title="Reset sample data">
              🔄 Reset Sample
            </button>
          </div>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Search by name, email, or department..." />
        </div>

        <div class="table-container">
          <table class="records-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="recordsTbody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>✏️ Edit Record</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label for="editName">Full Name *</label>
          <input type="text" id="editName" required />
        </div>
        <div class="form-group">
          <label for="editEmail">Email Address *</label>
          <input type="email" id="editEmail" required />
        </div>
        <div class="form-group">
          <label for="editDepartment">Department</label>
          <input type="text" id="editDepartment" />
        </div>
        <div class="form-group">
          <label for="editDetails">Details</label>
          <textarea id="editDetails" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelEditBtn" class="btn secondary-btn">Cancel</button>
          <button type="submit" class="btn primary-btn">Update Record</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
